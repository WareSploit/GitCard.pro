<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Card</title>
  <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  
  <header class="navbar">
    <div class="nav-left">
      <a href="https://github.com" target="_blank" class="logo">
        <svg height="32" viewBox="0 0 16 16" width="32" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
      </a>
    </div>
    <div class="nav-right">
      <select id="lang-switch" class="lang-switch">
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button id="tab-search" class="nav-btn active" data-i18n="tab_search">Поиск</button>
      <button id="tab-top" class="nav-btn" data-i18n="tab_top">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-right: 4px;"><path d="M2 20h20v2H2v-2zm0-12l4 4 6-8 6 8 4-4v10H2V8z"/></svg>
        Top 10
      </button>
      <button id="tab-viewed" class="nav-btn" data-i18n="tab_viewed">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: text-bottom; margin-right: 4px;"><path d="M12 2c0 0-4 4-4 9 0 2 1 3 1 3s-3-2-4-5c0 0-2 3-2 7 0 4 4 8 9 8s9-4 9-8c0-6-6-11-9-14zm0 18c-2.2 0-4-1.8-4-4 0-2 1.5-3.5 2.5-4.5 0 0 .5 1.5 1.5 2.5 0 0 1-1 1-3 1.2 1 3 2.8 3 5 0 2.2-1.8 4-4 4z"/></svg>
        Most Viewed
      </button>
    </div>
  </header>

  <main>
    <div id="view-search">
      <h1 data-i18n="title">GitHub Card</h1>
      <p class="sub" data-i18n="subtitle">Введи никнейм разработчика</p>
      
      <form id="form">
        <input id="username" type="text" placeholder="например, torvalds" autocomplete="off" spellcheck="false" data-i18n-placeholder="placeholder">
        <button type="submit" data-i18n="btn_find">Найти</button>
      </form>
    </div>

    <div id="view-top" class="hidden">
      <h1 data-i18n="title_top">Top 10</h1>
      <p class="sub" data-i18n="subtitle_top">Самые популярные разработчики</p>
    </div>

    <div id="view-viewed" class="hidden">
      <h1 data-i18n="title_viewed">Most Viewed</h1>
      <p class="sub" data-i18n="subtitle_viewed">Чаще всего ищут в рунете</p>
    </div>

    <div id="result" class="result"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
